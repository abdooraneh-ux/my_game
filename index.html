<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FPS Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; background: red; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #score-board {
      position: absolute; top: 15px; left: 15px; color: #fff;
      font-size: 20px; font-weight: bold; z-index: 10; text-shadow: 1px 1px 3px #000;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="crosshair"></div>
  <div id="score-board">النقاط: <span id="score">0</span></div>

  <script>
    let scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222233);

    let camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0);

    let renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    let light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    let floorGeo = new THREE.PlaneGeometry(50, 50);
    let floorMat = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide });
    let floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = Math.PI / 2;
    scene.add(floor);

    let targets = [];
    let score = 0;

    function createTarget() {
      let geo = new THREE.BoxGeometry(1, 1, 1);
      let mat = new THREE.MeshLambertMaterial({ color: 0xff3333 });
      let target = new THREE.Mesh(geo, mat);
      target.position.set((Math.random() - 0.5) * 15, 1 + Math.random() * 2, -5 - Math.random() * 10);
      scene.add(target);
      targets.push(target);
    }

    for (let i = 0; i < 5; i++) createTarget();

    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2(0, 0);

    window.addEventListener('touchstart', (e) => {
      raycaster.setFromCamera(mouse, camera);
      let intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        let hit = intersects[0].object;
        scene.remove(hit);
        targets = targets.filter(t => t !== hit);
        score += 10;
        document.getElementById('score').innerText = score;
        createTarget();
      }
    });

    let touchX = 0, touchY = 0;
    window.addEventListener('touchmove', (e) => {
      let touch = e.touches[0];
      if (touchX && touchY) {
        camera.rotation.y -= (touch.clientX - touchX) * 0.005;
        camera.rotation.x -= (touch.clientY - touchY) * 0.005;
      }
      touchX = touch.clientX;
      touchY = touch.clientY;
    });

    window.addEventListener('touchend', () => { touchX = 0; touchY = 0; });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
